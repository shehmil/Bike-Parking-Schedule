<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Parking Allocation - 7 Member Team (3 Slots)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0c;
            color: #e4e4e7;
            scroll-behavior: smooth;
        }

        .app-container {
            width: 100%;
            max-width: 72rem;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        .glass-card {
            background: rgba(23, 23, 26, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.2);
        }

        .highlight-card {
            background: linear-gradient(145deg, rgba(24, 24, 27, 0.95) 0%, rgba(10, 10, 12, 1) 100%);
            border: 1px solid rgba(59, 130, 246, 0.25);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px -12px rgba(0, 0, 0, 0.5);
        }

        .search-input {
            background: #18181b;
            border: 1px solid #27272a;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .month-chip.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .slot-pill {
            background: rgba(59, 130, 246, 0.08);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .slot-pill.on-leave {
            background: rgba(244, 63, 94, 0.08);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(12px);
        }

        .badge-today {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .leave-btn {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            color: #71717a;
            background: rgba(255,255,255,0.03);
            transition: all 0.2s ease;
        }
        .leave-btn:hover {
            border-color: #ef4444;
            color: #f87171;
        }
        .leave-btn.active {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        .excel-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: 900px;
        }
        .excel-table th {
            background: #18181b;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #27272a;
            padding: 14px 12px;
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #71717a;
        }
        .excel-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.85rem;
        }

        .sync-dot {
            width: 7px; height: 7px; border-radius: 999px;
            background: #f59e0b;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .sync-dot.connected { background: #22c55e; animation: none; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    </style>
</head>
<body class="antialiased">

    <div class="app-container py-6 md:py-10">
        <header class="sticky-header py-4 mb-8 border-b border-white/5">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                        <span class="text-blue-500">🚲</span> 2026 Parking
                    </h1>
                    <p class="text-zinc-500 text-sm mt-1 flex items-center gap-2">
                        7 Member Balanced Rotation (3 Slots)
                        <span class="inline-flex items-center gap-1.5 ml-2 text-[10px] uppercase font-bold tracking-wider">
                            <span id="syncDot" class="sync-dot"></span>
                            <span id="syncLabel" class="text-zinc-600">Connecting...</span>
                        </span>
                    </p>
                </div>

                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
                    <div class="relative flex-1 sm:min-w-[320px]">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search name, date, or holiday..."
                            class="search-input w-full px-5 py-3 rounded-2xl text-zinc-200 text-sm placeholder-zinc-600 shadow-xl"
                        >
                    </div>
                    <button onclick="exportToCSV()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-100 px-5 py-3 rounded-2xl text-sm font-semibold transition-all border border-white/5 whitespace-nowrap">
                        Export CSV
                    </button>
                </div>
            </div>

            <div id="monthFilter" class="flex gap-2 overflow-x-auto py-5 no-scrollbar"></div>
        </header>

        <section id="quickGlanceSection" class="mb-12">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-3">
                <h2 class="text-xs font-black text-zinc-500 uppercase tracking-[0.25em] flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span> Quick Glance
                </h2>
                <div class="flex items-center gap-4 bg-zinc-900/50 px-4 py-2 rounded-xl border border-white/5">
                    <span id="currentTime" class="text-xs text-blue-400 font-mono font-bold"></span>
                </div>
            </div>
            <div id="quickGlance" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

        <section>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
                <h2 class="text-xs font-black text-zinc-500 uppercase tracking-[0.25em] flex items-center gap-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-zinc-700"></span> Full Schedule
                </h2>
                <div class="flex items-center bg-zinc-900/80 p-1.5 rounded-2xl border border-white/5">
                    <button onclick="setView('feed')" id="feedBtn" class="text-[10px] font-bold uppercase py-2 px-6 rounded-xl transition-all bg-blue-500 text-white shadow-lg">Card View</button>
                    <button onclick="setView('excel')" id="excelBtn" class="text-[10px] font-bold uppercase py-2 px-6 rounded-xl transition-all text-zinc-500">Excel View</button>
                </div>
            </div>

            <div id="allocationFeed" class="space-y-4"></div>

            <div id="allocationExcel" class="hidden glass-card rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="excel-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Weekday</th>
                                <th>Slot 496</th>
                                <th>Slot 497</th>
                                <th>Slot 577</th>
                                <th>Primary Backup</th>
                                <th>Secondary Backup</th>
                                <th>Tertiary Backup</th>
                            </tr>
                        </thead>
                        <tbody id="excelBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <div id="emptyState" class="hidden text-center py-24">
            <p class="text-zinc-600 text-sm">No results found.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import {
            getDatabase, ref, set, remove, onValue
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5qyHqK1PWvj6IuslA4SSExyBAdkf0sDA",
            authDomain: "bike-parking-schedule.firebaseapp.com",
            databaseURL: "https://bike-parking-schedule-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bike-parking-schedule",
            storageBucket: "bike-parking-schedule.firebasestorage.app",
            messagingSenderId: "538229005257",
            appId: "1:538229005257:web:e1d752551acb2f285ca618",
            measurementId: "G-KFCWNRJ5TS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const leavesRef = ref(db, 'leaves');

        // leaveData shape: { "2026-03-15": { "slot496": true, "slot577": true }, ... }
        let leaveData = {};

        onValue(leavesRef, (snapshot) => {
            leaveData = snapshot.val() || {};
            const dot = document.getElementById('syncDot');
            const label = document.getElementById('syncLabel');
            if (dot && label) {
                dot.classList.add('connected');
                label.textContent = 'Live';
                label.classList.remove('text-zinc-600');
                label.classList.add('text-emerald-500');
            }
            renderQuickGlance();
            renderViewData(document.getElementById('searchInput').value);
        }, (error) => {
            const label = document.getElementById('syncLabel');
            if (label) { label.textContent = 'Offline'; }
            console.error('Firebase read failed:', error);
        });

        window.toggleLeave = function(dateId, slotKey) {
            const isCurrentlyOnLeave = !!(leaveData[dateId] && leaveData[dateId][slotKey]);
            const path = ref(db, `leaves/${dateId}/${slotKey}`);
            if (isCurrentlyOnLeave) {
                remove(path).catch(err => alert('Could not update: ' + err.message));
            } else {
                set(path, true).catch(err => alert('Could not update: ' + err.message));
            }
        };

        const members = ["Gopu", "User1", "Arjun Reeja", "Shehmil", "Chanthuraj", "Sumesh", "Akhil"];

        const holidays = {
            "2026-01-26": "Republic Day",
            "2026-04-03": "Good Friday",
            "2026-04-15": "Vishu",
            "2026-05-01": "May Day",
            "2026-05-27": "Id-ul-Ad'ha Bakrid",
            "2026-08-25": "First Onam/Milad-i-Sherif",
            "2026-08-26": "Thiruvonam",
            "2026-10-02": "Gandhi Jayanthi",
            "2026-10-20": "Mahanavami",
            "2026-12-25": "Christmas"
        };

        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let masterData = [];
        let activeMonth = months[new Date().getMonth()];
        let currentView = 'feed';

        // Backups are used in strict priority order (Primary, Secondary, Tertiary)
        // regardless of which slot goes on leave. If only one slot is on leave,
        // Primary Backup always covers it. Secondary only steps in if Primary is
        // already covering a different slot on leave that same day, and so on.
        const SLOT_ORDER = ['slot496', 'slot497', 'slot577'];
        const BACKUP_PRIORITY = ['backupP', 'backupS', 'backupT'];

        function computeBackupAssignments(item) {
            const onLeaveSlots = SLOT_ORDER.filter(sk => isSlotOnLeave(item.id, sk));
            const assignment = {};
            onLeaveSlots.forEach((slotKey, idx) => {
                const backupKey = BACKUP_PRIORITY[idx]; // idx 0 -> highest priority available
                assignment[slotKey] = item.assignments[backupKey];
            });
            return assignment;
        }

        function formatDateKey(date) {
            return [
                date.getFullYear(),
                String(date.getMonth() + 1).padStart(2, '0'),
                String(date.getDate()).padStart(2, '0')
            ].join('-');
        }

        function generateFairYearData() {
            const data = [];
            let workingDayCounter = 0;

            for (let m = 0; m < 12; m++) {
                for (let d = 1; d <= 31; d++) {
                    const date = new Date(2026, m, d);
                    if (date.getMonth() !== m) continue;
                    if (date.getDay() === 0 || date.getDay() === 6) continue;

                    const dateKey = formatDateKey(date);
                    const holidayName = holidays[dateKey];
                    const isHoliday = !!holidayName;

                    let entry = {
                        id: dateKey,
                        month: months[m],
                        displayDate: date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                        dayName: date.toLocaleDateString('en-US', { weekday: 'long' }),
                        fullDateString: date.toDateString(),
                        isHoliday: isHoliday,
                        holidayName: holidayName,
                        assignments: null
                    };

                    if (!isHoliday) {
                        const len = members.length;
                        entry.assignments = {
                            slot496: members[workingDayCounter % len],
                            slot497: members[(workingDayCounter + 1) % len],
                            slot577: members[(workingDayCounter + 2) % len],
                            backupP: members[(workingDayCounter + 3) % len],
                            backupS: members[(workingDayCounter + 4) % len],
                            backupT: members[(workingDayCounter + 5) % len]
                        };
                        workingDayCounter++;
                    }
                    data.push(entry);
                }
            }
            return data;
        }

        function isSlotOnLeave(dateId, slotKey) {
            return !!(leaveData[dateId] && leaveData[dateId][slotKey]);
        }

        function slotDisplayHtml(item, slotKey, primaryPerson, extraClasses) {
            const onLeave = isSlotOnLeave(item.id, slotKey);

            if (onLeave) {
                const backupAssignments = computeBackupAssignments(item);
                const backupPerson = backupAssignments[slotKey];
                return `
                    <span class="${extraClasses} line-through opacity-50">${primaryPerson}</span>
                    <span class="text-rose-400 font-bold ml-1">→ ${backupPerson}</span>
                `;
            }
            return `<span class="${extraClasses}">${primaryPerson}</span>`;
        }

        function leaveButtonHtml(item, slotKey, primaryPerson) {
            const onLeave = isSlotOnLeave(item.id, slotKey);
            return `
                <button
                    class="leave-btn ${onLeave ? 'active' : ''}"
                    onclick="toggleLeave('${item.id}', '${slotKey}')"
                    title="${onLeave ? 'Cancel leave for ' + primaryPerson : 'Mark ' + primaryPerson + ' on leave'}"
                >
                    ${onLeave ? 'On Leave ✕' : 'Mark Leave'}
                </button>
            `;
        }

        function createHighlightCardHtml(item) {
            if (!item) return '';
            if (item.isHoliday) {
                return `
                    <div class="glass-card rounded-3xl p-8 flex flex-col justify-between min-h-[180px] opacity-60">
                        <div>
                            <span class="badge-today bg-zinc-800 border-zinc-700 text-zinc-500 mb-4 inline-block">${item.label}</span>
                            <p class="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em] mb-2">${item.displayDate}</p>
                            <h3 class="text-2xl font-bold text-red-400/80 italic">${item.holidayName}</h3>
                        </div>
                        <div class="text-[10px] text-zinc-600 font-black uppercase tracking-[0.2em]">Office Closed</div>
                    </div>
                `;
            }

            const slotBlock = (slotKey, label) => `
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[9px] uppercase text-blue-400 font-black tracking-widest opacity-70">${label}</span>
                        ${leaveButtonHtml(item, slotKey, item.assignments[slotKey])}
                    </div>
                    <p class="text-lg font-bold text-white truncate">
                        ${slotDisplayHtml(item, slotKey, item.assignments[slotKey], '')}
                    </p>
                </div>
            `;

            return `
                <div class="glass-card highlight-card rounded-3xl p-8 min-h-[180px]">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span class="badge-today mb-4 inline-block">${item.label}</span>
                            <p class="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em]">${item.displayDate}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 relative z-10">
                        ${slotBlock('slot496', 'Slot 496')}
                        ${slotBlock('slot497', 'Slot 497')}
                        ${slotBlock('slot577', 'Slot 577')}
                    </div>
                    <div class="text-[10px] text-zinc-500 flex flex-wrap gap-4 justify-between border-t border-white/5 pt-5 relative z-10">
                        <span>Backup: <strong class="text-zinc-300 ml-1 uppercase font-bold">${item.assignments.backupP}</strong></span>
                        <span>Sec: <strong class="text-zinc-300 ml-1 uppercase font-bold">${item.assignments.backupS}</strong></span>
                        <span>Ter: <strong class="text-zinc-300 ml-1 uppercase font-bold">${item.assignments.backupT}</strong></span>
                    </div>
                </div>
            `;
        }

        function renderMonthFilter() {
            const container = document.getElementById('monthFilter');
            container.innerHTML = `<div class="month-chip ${activeMonth === null ? 'active' : 'text-zinc-500'} border border-white/10 px-6 py-2 rounded-2xl text-xs font-bold uppercase tracking-widest cursor-pointer" onclick="setMonth(null, this)">All Year</div>` +
                months.map(m => `
                    <div class="month-chip ${activeMonth === m ? 'active' : 'text-zinc-500'} border border-white/10 px-6 py-2 rounded-2xl text-xs font-bold uppercase tracking-widest cursor-pointer" onclick="setMonth('${m}', this)">${m}</div>
                `).join('');

            setTimeout(() => {
                const activeChip = container.querySelector('.month-chip.active');
                if (activeChip) {
                    activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }, 100);
        }

        window.setMonth = function(m, el) {
            document.querySelectorAll('.month-chip').forEach(c => {
                c.classList.remove('active', 'bg-blue-500', 'text-white');
                c.classList.add('text-zinc-500');
            });
            el.classList.add('active');
            el.classList.remove('text-zinc-500');
            activeMonth = m;
            renderViewData(document.getElementById('searchInput').value);
        };

        window.setView = function(view) {
            currentView = view;
            const feedContainer = document.getElementById('allocationFeed');
            const excelContainer = document.getElementById('allocationExcel');
            const feedBtn = document.getElementById('feedBtn');
            const excelBtn = document.getElementById('excelBtn');

            if (view === 'feed') {
                feedContainer.classList.remove('hidden');
                excelContainer.classList.add('hidden');
                feedBtn.className = "text-[10px] font-bold uppercase py-2 px-6 rounded-xl transition-all bg-blue-500 text-white shadow-lg";
                excelBtn.className = "text-[10px] font-bold uppercase py-2 px-6 rounded-xl transition-all text-zinc-500";
            } else {
                feedContainer.classList.add('hidden');
                excelContainer.classList.remove('hidden');
                excelBtn.className = "text-[10px] font-bold uppercase py-2 px-6 rounded-xl transition-all bg-blue-500 text-white shadow-lg";
                feedBtn.className = "text-[10px] font-bold uppercase py-2 px-6 rounded-xl transition-all text-zinc-500";
            }
            renderViewData(document.getElementById('searchInput').value);
        };

        function renderViewData(filter = "") {
            const feed = document.getElementById('allocationFeed');
            const excelBody = document.getElementById('excelBody');
            const emptyState = document.getElementById('emptyState');
            const query = filter.toLowerCase();

            const filteredData = masterData.filter(item => {
                const matchesMonth = !activeMonth || item.month === activeMonth;
                if (!matchesMonth) return false;
                if (!query) return true;
                if (item.id.includes(query)) return true;
                if (item.holidayName?.toLowerCase().includes(query)) return true;
                return item.assignments?.slot496.toLowerCase().includes(query) ||
                       item.assignments?.slot497.toLowerCase().includes(query) ||
                       item.assignments?.slot577.toLowerCase().includes(query) ||
                       item.assignments?.backupP.toLowerCase().includes(query) ||
                       item.assignments?.backupS.toLowerCase().includes(query) ||
                       item.assignments?.backupT.toLowerCase().includes(query);
            });

            if (filteredData.length === 0) {
                feed.innerHTML = ""; excelBody.innerHTML = "";
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            if (currentView === 'feed') {
                feed.innerHTML = filteredData.map(item => {
                    if (item.isHoliday) {
                        return `
                            <div class="glass-card rounded-2xl p-5 flex items-center justify-between opacity-50 border-l-4 border-red-500/20">
                                <span class="text-[10px] font-black text-zinc-500 uppercase tracking-widest w-32">${item.displayDate}</span>
                                <span class="text-xs font-bold text-red-400/70">${item.holidayName}</span>
                                <span class="text-[9px] text-zinc-600 font-black uppercase tracking-widest">Closed</span>
                            </div>
                        `;
                    }

                    const pill = (slotKey, label) => {
                        const onLeave = isSlotOnLeave(item.id, slotKey);
                        return `
                            <div class="slot-pill ${onLeave ? 'on-leave' : ''} px-4 py-2 rounded-xl text-xs font-bold border flex items-center gap-2">
                                <span class="text-[9px] opacity-50 font-black">${label}:</span>
                                ${slotDisplayHtml(item, slotKey, item.assignments[slotKey], '')}
                                ${leaveButtonHtml(item, slotKey, item.assignments[slotKey])}
                            </div>
                        `;
                    };

                    return `
                        <div class="glass-card rounded-2xl p-6 flex flex-col gap-4 border-l-4 border-blue-500/20">
                            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
                                <div class="w-32 shrink-0">
                                    <p class="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em]">${item.displayDate}</p>
                                </div>
                                <div class="flex flex-1 flex-wrap gap-3">
                                    ${pill('slot496', '496')}
                                    ${pill('slot497', '497')}
                                    ${pill('slot577', '577')}
                                    <div class="bg-zinc-800/40 text-zinc-400 px-4 py-2 rounded-xl text-[11px] border border-white/5">
                                        Bk: ${item.assignments.backupP} / ${item.assignments.backupS} / ${item.assignments.backupT}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                excelBody.innerHTML = filteredData.map(item => {
                    if (item.isHoliday) {
                        return `
                            <tr class="holiday-row opacity-60">
                                <td class="font-mono text-[11px] tracking-tight">${item.id}</td>
                                <td class="font-medium">${item.dayName}</td>
                                <td colspan="6" class="text-center text-red-400/60 font-black uppercase tracking-widest py-4 text-[10px]">${item.holidayName}</td>
                            </tr>
                        `;
                    }

                    const cell = (slotKey) => {
                        const onLeave = isSlotOnLeave(item.id, slotKey);
                        return `
                            <td class="text-blue-400 font-bold uppercase tracking-tight">
                                <div class="flex items-center gap-2">
                                    ${slotDisplayHtml(item, slotKey, item.assignments[slotKey], onLeave ? '' : '')}
                                    ${leaveButtonHtml(item, slotKey, item.assignments[slotKey])}
                                </div>
                            </td>
                        `;
                    };

                    return `
                        <tr>
                            <td class="font-mono text-[11px] text-zinc-500 tracking-tight">${item.id}</td>
                            <td class="text-zinc-400 font-bold text-[11px] uppercase tracking-wider">${item.dayName}</td>
                            ${cell('slot496')}
                            ${cell('slot497')}
                            ${cell('slot577')}
                            <td class="text-zinc-300 font-medium">${item.assignments.backupP}</td>
                            <td class="text-zinc-300 font-medium">${item.assignments.backupS}</td>
                            <td class="text-zinc-300 font-medium">${item.assignments.backupT}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        function renderQuickGlance() {
            const container = document.getElementById('quickGlance');
            const now = new Date();
            let anchorDate = now.getFullYear() === 2026 ? now : new Date(2026, 0, 7);
            const todayKey = formatDateKey(anchorDate);

            const todayData = masterData.find(d => d.id === todayKey);
            const nextAssignmentIndex = masterData.findIndex(d => d.id === todayKey) + 1;
            const nextAssignmentData = masterData[nextAssignmentIndex] || null;

            let html = "";
            if (todayData) {
                todayData.label = "Today's Allocation";
                html += createHighlightCardHtml(todayData);
            } else {
                html += `
                    <div class="glass-card rounded-3xl p-8 flex flex-col justify-center min-h-[180px] opacity-40">
                        <span class="badge-today bg-zinc-800 text-zinc-500 mb-4 self-start">Weekend</span>
                        <p class="text-zinc-500 text-sm italic">The office is closed for the weekend.</p>
                    </div>
                `;
            }

            if (nextAssignmentData) {
                nextAssignmentData.label = "Next Working Day";
                html += createHighlightCardHtml(nextAssignmentData);
            }
            container.innerHTML = html;
        }

        window.exportToCSV = function() {
            let csv = "Date,Day,Status,Slot 496,Slot 497,Slot 577,Primary Backup,Secondary Backup,Tertiary Backup,Leave Notes\n";
            masterData.forEach(item => {
                const status = item.isHoliday ? item.holidayName : "Working";
                let leaveNotes = [];
                if (!item.isHoliday) {
                    ['slot496','slot497','slot577'].forEach(sk => {
                        if (isSlotOnLeave(item.id, sk)) {
                            leaveNotes.push(`${item.assignments[sk]} on leave (${sk})`);
                        }
                    });
                }
                csv += `${item.id},${item.dayName},${status},${item.isHoliday ? '' : item.assignments.slot496},${item.isHoliday ? '' : item.assignments.slot497},${item.isHoliday ? '' : item.assignments.slot577},${item.isHoliday ? '' : item.assignments.backupP},${item.isHoliday ? '' : item.assignments.backupS},${item.isHoliday ? '' : item.assignments.backupT},"${leaveNotes.join('; ')}"\n`;
            });
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = "Parking_Allocation_2026_3_Slots.csv";
            link.click();
        };

        masterData = generateFairYearData();
        renderMonthFilter();
        renderQuickGlance();
        renderViewData();

        document.getElementById('searchInput').addEventListener('input', (e) => renderViewData(e.target.value));

        let lastSeenDateKey = formatDateKey(new Date());

        setInterval(() => {
            const timeEl = document.getElementById('currentTime');
            const now = new Date();
            if (timeEl) {
                timeEl.innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' +
                                  now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            }

            // Detect when the calendar day rolls over (e.g. tab left open past midnight)
            const currentDateKey = formatDateKey(now);
            if (currentDateKey !== lastSeenDateKey) {
                lastSeenDateKey = currentDateKey;
                activeMonth = months[now.getMonth()];
                renderMonthFilter();
                renderQuickGlance();
                renderViewData(document.getElementById('searchInput').value);
            }
        }, 1000);
    </script>
</body>
</html>
